name: Windows Product Build

on:
  pull_request:
    paths:
      - "packaging/windows/**"
      - "native/ordax-workbench/**"
      - "tests/test_studio_host_transport_boundary.py"
      - "ordax_core/**"
      - "ordax_dev_agent/**"
      - "ordax_device_agent/**"
      - "ordax_studio/**"
      - "native/ordax-workbench/**"
      - "scripts/windows/build-ordax-studio-product.ps1"
      - "scripts/windows/ordax-studio-start.ps1"
      - "scripts/windows/ordax-upgrade-quiesce.ps1"
      - "scripts/windows/assert-release-authenticode.ps1"
      - "scripts/windows/assert-release-provenance.ps1"
      - "scripts/windows/assert-release-main-ancestry.ps1"
      - "tests/test_release_main_ancestry.py"
      - "scripts/windows/test-ordax-studio-install-smoke.ps1"
      - "tests/test_release_provenance.py"
      - "tests/test_windows_product_packaging.py"
      - "tests/test_release_signer_identity.py"
      - "pyproject.toml"
      - "studio-source.lock.json"
      - ".github/workflows/windows-product-build.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packaging-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging contract tests
        run: python -m unittest tests.test_windows_product_packaging tests.test_release_provenance tests.test_release_signer_identity tests.test_release_main_ancestry tests.test_studio_host_transport_boundary
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build native ORDAX Workbench
        run: dotnet build native/ordax-workbench/Ordax.Workbench.csproj --configuration Release
        shell: powershell

  build-installer:
    needs: packaging-contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve canonical Studio source lock
        shell: powershell
        run: |
          $lock = Get-Content .\\studio-source.lock.json -Raw | ConvertFrom-Json
          if ($lock.schema -ne "ordax.studio-source-lock/1") { throw "Studio source lock schema is invalid" }
          "ORDAX_STUDIO_SOURCE_COMMIT=$($lock.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout canonical ORDAX Studio app source
        uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-apps
          ref: ${{ env.ORDAX_STUDIO_SOURCE_COMMIT }}
          path: .ordax/apps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build ORDAX Studio product from canonical app source
        shell: powershell
        env:
          ORDAX_STUDIO_APP_SOURCE: ${{ github.workspace }}\.ordax\apps\apps\studio
        run: .\scripts\windows\build-ordax-studio-product.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\dist\windows"
      - name: Verify build did not rewrite Runtime Studio sources
        shell: powershell
        run: |
          $sourceChanges = @(git status --porcelain -- ordax_studio)
          if ($LASTEXITCODE -ne 0 -or $sourceChanges.Count -ne 0) {
            throw "Windows build modified Runtime Studio checkout sources instead of installer staging"
          }
          Write-Host "ORDAX_STUDIO_RUNTIME_SOURCE_UNCHANGED"
      - name: Write checksums
        shell: powershell
        run: |
          Get-ChildItem .\dist\windows\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content .\dist\windows\SHA256SUMS.txt -Encoding ascii
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: |
            dist/windows/ORDAX-Studio-Setup-*.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  install-smoke:
    needs: build-installer
    runs-on: windows-latest
    steps:
      - name: Checkout pinned Runtime smoke implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: artifact
      - name: Install, migrate legacy launcher, upgrade running runtime, and verify health
        shell: powershell
        run: .\scripts\windows\test-ordax-studio-install-smoke.ps1 -ArtifactDirectory ".\artifact"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: windows-production-release
    needs:
      - build-installer
      - install-smoke
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged Runtime source and canonical Studio lock
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged Runtime commit belongs to canonical main
        shell: powershell
        run: .\scripts\windows\assert-release-main-ancestry.ps1 -Tag "$env:GITHUB_REF_NAME" -ExpectedCommit "$env:GITHUB_SHA" -RepositoryRoot "."
      - name: Download validated Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ordax-studio-windows-x64
          path: artifact
      - name: Verify release provenance and artifact digest
        shell: powershell
        run: |
          .\scripts\windows\assert-release-provenance.ps1 -Tag "$env:GITHUB_REF_NAME" -SourceLock ".\studio-source.lock.json" -ArtifactDirectory ".\artifact"
      - name: Verify production Authenticode signature and authorized publisher
        shell: powershell
        env:
          ORDAX_RELEASE_SIGNER_THUMBPRINTS: ${{ vars.ORDAX_RELEASE_SIGNER_THUMBPRINTS }}
        run: |
          $installer = Get-ChildItem .\artifact\ORDAX-Studio-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Validated ORDAX Studio installer is missing" }
          .\scripts\windows\assert-release-authenticode.ps1 -Path $installer.FullName -TrustedSignerThumbprints $env:ORDAX_RELEASE_SIGNER_THUMBPRINTS
      - name: Install and upgrade from final signed release bytes
        shell: powershell
        run: .\scripts\windows\test-ordax-studio-install-smoke.ps1 -ArtifactDirectory ".\artifact"
      - name: Reverify final installer SHA-256 after signed installation smoke
        shell: powershell
        run: .\scripts\windows\assert-release-provenance.ps1 -Tag "$env:GITHUB_REF_NAME" -SourceLock ".\studio-source.lock.json" -ArtifactDirectory ".\artifact"
      - name: Publish GitHub Release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem .\artifact\ORDAX-Studio-Setup-*.exe | Select-Object -First 1
          $checksums = Get-Item .\artifact\SHA256SUMS.txt
          if (-not $installer) { throw "Validated ORDAX Studio installer is missing" }
          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            throw "Release tag already published. Refusing to replace immutable installer assets."
          }
          gh release create $tag $installer.FullName $checksums.FullName --verify-tag --title "ORDAX Studio $tag" --generate-notes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
