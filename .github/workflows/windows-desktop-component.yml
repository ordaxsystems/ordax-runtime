name: OrdaX Desktop Runtime Component

on:
  pull_request:
    paths:
      - "packaging/windows/desktop*"
      - "packaging/windows/build_desktop_component.py"
      - "tests/test_desktop_component_package.py"
      - "ordax_dev_agent/**"
      - "ordax_connector/**"
      - "ordax_core/**"
      - "mcp_blender_unity/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop-component.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-component:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: packaging/windows/desktop-requirements.lock
      - name: Install exact hashed Windows build closure
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/windows/desktop-requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency lock failed' }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
      - name: Test identity isolation and canonical transport
        run: |
          python -m unittest tests.test_desktop_host_runtime_boundaries tests.test_desktop_component_package tests.test_product_device_control_plane tests.test_product_central_session tests.test_device_setup_trusted_ingress
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Runtime contract failed' }
      - name: Build one self-contained component and prove it outside the checkout
        run: python packaging/windows/build_desktop_component.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordax-desktop-runtime-candidate-${{ github.sha }}
          path: dist/desktop-component/
          if-no-files-found: error
          retention-days: 14
