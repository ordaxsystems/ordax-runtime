name: Native Buildroot Source Compatibility

on:
  pull_request:
    paths:
      - "tools/ci/audit_buildroot_lock.py"
      - "tests/test_native_buildroot_lock.py"
      - "docs/NATIVE-BUILDROOT-COMPATIBILITY.md"
      - ".github/workflows/native-buildroot-source-audit.yml"
      - "tools/ci/probe_native_buildroot_agent.py"
      - "ordax_dev_agent/**"
      - "ordax_core/**"
      - "ordax_connector/**"
      - "mcp_blender_unity/**"
  push:
    branches: [main]
    paths:
      - "tools/ci/audit_buildroot_lock.py"
      - "tests/test_native_buildroot_lock.py"
      - "docs/NATIVE-BUILDROOT-COMPATIBILITY.md"
      - ".github/workflows/native-buildroot-source-audit.yml"
      - "tools/ci/probe_native_buildroot_agent.py"
      - "ordax_dev_agent/**"
      - "ordax_core/**"
      - "ordax_connector/**"
      - "mcp_blender_unity/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-buildroot-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Runtime authoritative source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate pinned runtime lock parser and Buildroot drift gates
        run: |
          python3 -m py_compile tools/ci/audit_buildroot_lock.py
          python3 -m unittest tests.test_native_buildroot_lock -v


  native-buildroot-offline-agent-probe:
    # Diagnostic only. The OS owns this Buildroot target and private toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OS_REPO: ordaxsystems/ordax-os
      OS_RUN_ID: "39882367206"
      OS_RUN_HEAD_SHA: "b1a260720e8db4dd30ae67b1a4313a56a6e346b4"
      OS_ARTIFACT_NAME: ordax-independent-python-abi-473aabac980b0bda9b6ea0f4d43987738ea80674
    steps:
      - name: Checkout canonical Runtime source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify immutable OS-owned Buildroot workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$OS_REPO/actions/runs/$OS_RUN_ID" \
            --jq '[.head_sha, .status, .conclusion, .head_branch] | @tsv' > "$RUNNER_TEMP/os-run-provenance"
          IFS=$'\t' read -r head status conclusion branch < "$RUNNER_TEMP/os-run-provenance"
          test "$head" = "$OS_RUN_HEAD_SHA"
          test "$status" = completed
          test "$conclusion" = success
          test "$branch" = buildroot/private-native-sdk-export-20261022
          gh api "repos/$OS_REPO/actions/runs/$OS_RUN_ID/artifacts" \
            --jq '.artifacts[] | [.name, .expired] | @tsv' > "$RUNNER_TEMP/os-artifacts"
          grep -Fx -- "$OS_ARTIFACT_NAME"$'\t'false "$RUNNER_TEMP/os-artifacts"
      - name: Download exact successful OS-private Buildroot Python and SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ordax-native-buildroot-target"
          gh run download "$OS_RUN_ID" \
            -R "$OS_REPO" \
            -n "$OS_ARTIFACT_NAME" \
            -D "$RUNNER_TEMP/ordax-native-buildroot-target"
          test -s "$RUNNER_TEMP/ordax-native-buildroot-target/native-python-provenance.json"
          test -s "$RUNNER_TEMP/ordax-native-buildroot-target/native-python-build-input.rootfs.tar"
      - name: Execute canonical Native agent on private musl Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.ci.probe_native_buildroot_agent \
            --receipt "$RUNNER_TEMP/ordax-native-buildroot-target/native-python-provenance.json" \
            --private-target-tar "$RUNNER_TEMP/ordax-native-buildroot-target/native-python-build-input.rootfs.tar" \
            --stage-private-target | tee "$RUNNER_TEMP/native-agent-bootstrap-result.json"
      - name: Assert the host-only proof cannot authorize a device
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/native-agent-bootstrap-result.json" <<'PY'
          import json
          import pathlib
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["offline_bootstrap_proven"] is True, report
          assert report["device_install_authorized"] is False
          assert report["full_native_runtime_dependency_closure_proven"] is False
          assert report["device_execution_proven"] is False
          print("Real host-kernel Native bootstrap proven; device/MCP gates remain closed")
          PY
