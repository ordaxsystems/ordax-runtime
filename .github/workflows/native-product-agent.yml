name: Native Product Runtime Candidate

on:
  pull_request:
    paths:
      - "ordax_dev_agent/**"
      - "ordax_core/**"
      - "ordax_connector/**"
      - "mcp_blender_unity/**"
      - "native/ordax-product-agent/**"
      - "tests/test_native_product_package.py"
      - "tests/test_native_product_abi.py"
      - "tests/test_native_buildroot_lock.py"
      - "tools/ci/audit_buildroot_lock.py"
      - "pyproject.toml"
      - ".github/workflows/native-product-agent.yml"
  push:
    branches: [main]
    paths:
      - "ordax_dev_agent/**"
      - "ordax_core/**"
      - "ordax_connector/**"
      - "mcp_blender_unity/**"
      - "native/ordax-product-agent/**"
      - "tests/test_native_product_package.py"
      - "tests/test_native_product_abi.py"
      - "tests/test_native_buildroot_lock.py"
      - "tools/ci/audit_buildroot_lock.py"
      - "pyproject.toml"
      - ".github/workflows/native-product-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-product-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit Independent Base ELF and exact dependency locks
        run: python3 -m unittest tests.test_native_product_abi tests.test_native_buildroot_lock -v
      - name: Build the pinned native executable candidate
        run: docker build --platform linux/amd64 -f native/ordax-product-agent/Dockerfile -t ordax-native-product-candidate .
      - name: Exercise the executable without network or an installed Python
        run: |
          mkdir -p out
          docker run --rm --network none --read-only --tmpfs /tmp:exec \
            ordax-native-product-candidate --self-test > out/self-test.json
          container=$(docker create ordax-native-product-candidate --self-test)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/output/ordax-product-agent" out/ordax-product-agent
          python3 native/ordax-product-agent/provenance.py --source-commit "$GITHUB_SHA" --output out
          # Prove the actual binary's ELF dependencies independently of its
          # successful container self-test. Do not confuse CI green with
          # kernel-only activation readiness. This report is diagnostic until
          # the signed Independent Base can consume the exact native artifact.
          python3 native/ordax-product-agent/audit_elf.py \
            --binary out/ordax-product-agent \
            --recipe native/ordax-product-agent/Dockerfile \
            > "$RUNNER_TEMP/ordax-native-abi.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ordax-native-abi.json").read_text())
          manifest = json.loads(Path("out/candidate.json").read_text())
          assert manifest["independent_base_abi_ready"] is report["independent_base_abi_ready"]
          assert manifest["independent_base_abi_blockers"] == report["blockers"]
          assert manifest["elf_interpreter"] == report["interpreter"]
          assert manifest["elf_needed_libraries"] == report["needed_libraries"]
          assert manifest["embedded_elf_inventory"] == report["embedded_elf_inventory"]
          inventory = report["embedded_elf_inventory"]
          assert inventory["read_only_audit"] is True
          assert inventory["independent_base_compatibility_proven"] is False
          assert inventory["install_authorized"] is False
          assert inventory["native_entry_count"] > 0
          assert manifest["installation_authorized_by_candidate"] is False
          print("INDEPENDENT_BASE_NATIVE_ABI_READY=" + ("YES" if report["independent_base_abi_ready"] else "NO"))
          print("ABI_BLOCKERS=" + ",".join(report["blockers"]))
          print("EMBEDDED_ELF_COUNT=" + str(inventory["native_entry_count"]))
          print("UNPROVIDED_ELF_DEPENDENCIES=" + ",".join(inventory["unprovided_needed_names"]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordax-native-product-candidate-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
