name: ORDAX Runtime Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep the existing required checks; only proven documentation edits skip
  # expensive Linux and Windows contract suites. Unknown diffs fail closed.
  change-impact:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact documentation-only diff
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No valid base, missing Git history or diff error -> run every suite.
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ ! "$BASE_SHA" =~ ^0{40}$ ]] &&
             git fetch --no-tags --depth=1 origin "$BASE_SHA" &&
             git diff --name-status -z --no-renames "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-status"; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          from pathlib import Path

          raw = (Path(os.environ["RUNNER_TEMP"]) / "changed-status").read_bytes()
          parts = raw.split(b"\0")
          if parts[-1:] == [b""]:
              parts.pop()
          entries = list(zip(parts[::2], parts[1::2])) if len(parts) % 2 == 0 else []
          docs_only = bool(entries) and all(
              status == b"M" and path in {b"AGENTS.md", b"README.md"}
              for status, path in entries
          )
          print(f"docs_only={str(docs_only).lower()}")
          print(f"Runtime contract impact: {entries!r}; docs_only={docs_only}", file=sys.stderr)
          PY
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Unproven documentation-only diff; full Runtime Contracts applies'
          fi

  native-runtime-composition:
    needs: change-impact
    if: needs.change-impact.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the canonical Runtime
        run: python -m pip install --disable-pip-version-check .
      - name: Verify project workspace grant and Git boundaries (Linux)
        run: python -m unittest tests.test_project_workspace_port tests.test_workspace_resource_selection tests.test_windows_owner_workspace_picker tests.test_owner_project_scope_resolver tests.test_project_workspace_live_proof tests.test_workspace_device_live_authority tests.test_workspace_two_phase_issuance_client -v

      - name: Verify native composition and shared transport lifecycle on Linux
        run: >-
          python -m unittest
          tests.test_native_runtime_composition
          tests.test_native_private_buildroot_target
          tests.test_native_buildroot_source_bootstrap
          tests.test_native_buildroot_agent_probe
          tests.test_product_device_control_plane
          tests.test_remote_protocol
          tests.test_product_ingress_failover
          tests.test_owner_device_connect_gui
          tests.test_native_product_credential_guard
          tests.test_product_wake_signal
          tests.test_product_central_session
          tests.test_terminal_outbox
          tests.test_orchestrator_app_bridge
          tests.test_orchestrator_product_authority
          tests.test_orchestrator_product_execution
          tests.test_orchestrator_app_launcher
          tests.test_canonical_control_plane_defaults
          tests.test_ordax_device_agent_alias

  product-mcp-minimum-sdk:
    needs: change-impact
    if: needs.change-impact.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Runtime with the supported MCP SDK floor
        run: python -m pip install --disable-pip-version-check . "mcp==1.30.0"
      - name: Verify registered tools and recovery on the minimum SDK
        run: python -m unittest tests.test_product_action_recovery tests.test_product_remote_client tests.test_product_mcp_server tests.test_device_mcp_headless_files

  runtime-contracts:
    needs: change-impact
    if: needs.change-impact.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The Windows package already consumes this exact Platform source lock.
      # Do not test a floating Platform main while packaging an immutable pin.
      - name: Resolve canonical Platform consumer revision from existing Runtime lock
        id: platform-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& python -c 'from ordax_dev_agent.control_plane_provenance import read_control_plane_source_lock; print(read_control_plane_source_lock("control-plane-source.lock.json")["commit"])').Trim()
          if ($LASTEXITCODE -ne 0 -or $commit.Length -ne 40 -or $commit -cmatch '[^0-9a-f]') {
            throw 'Invalid immutable Platform revision from the canonical Runtime lock'
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Checkout pinned Platform public Product auth configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ordaxsystems/ordax-platform
          ref: ${{ steps.platform-source.outputs.commit }}
          path: .ordax/platform
          persist-credentials: false
      - name: Assert every repository workflow uses immutable remote actions
        run: python -m unittest tests.test_release_signing_contract.ReleaseSigningContractTests.test_repository_workflow_remote_actions_are_immutable -v
      - name: Install Runtime package and test dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Assert installed Runtime public auth metadata matches Platform owner SSOT
        run: python -m unittest tests.test_public_product_auth_owner_parity -v

      - name: Compile Runtime packages
        run: python -m compileall -q ordax_connector ordax_dev_agent ordax_device_agent ordax_studio mcp_blender_unity

      - name: Verify project workspace grant and Git boundaries (Windows)
        run: python -m unittest tests.test_project_workspace_port tests.test_workspace_resource_selection tests.test_windows_owner_workspace_picker tests.test_owner_project_scope_resolver tests.test_project_workspace_live_proof tests.test_workspace_device_live_authority -v
      - name: Validate managed runtime, updater, and publication governance PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/windows/ordax-device-agent-setup.ps1',
            'scripts/windows/apply-ordax-production-update.ps1',
            'scripts/windows/assert-release-main-ancestry.ps1',
            'scripts/windows/assert-github-main-governance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Run Runtime ownership, release governance, and Computer Control contracts
        run: >-
          python -m unittest
          tests.test_release_main_ancestry
          tests.test_agent_recovery_governance_contract
          tests.test_agent_self_heal_scripts
          tests.test_product_gateway
          tests.test_orchestrator_app_bridge
          tests.test_orchestrator_product_authority
          tests.test_orchestrator_product_execution
          tests.test_orchestrator_app_launcher
          tests.test_application_intelligence_actions
          tests.test_product_mcp
          tests.test_product_remote_client
          tests.test_owner_central_device_selection_client
          tests.test_connector_owner_grants
          tests.test_owner_grants_cli
          tests.test_product_action_recovery
          tests.test_product_central_session
          tests.test_product_device_control_plane
          tests.test_product_project_binding_reconcile
          tests.test_desktop_project_binding
          tests.test_remote_protocol
          tests.test_terminal_outbox
          tests.test_runtime_operational_status
          tests.test_product_idle_poll_budget
          tests.test_product_update
          tests.test_product_update_apply
          tests.test_owner_dev_update_preflight
          tests.test_versioning
          tests.test_studio_managed_browser_contract
          tests.test_product_action_scope_parity
          tests.test_computer_parity_contract
          tests.test_computer_focus_window
          tests.test_computer_access_management
          tests.test_computer_full_access
          tests.test_computer_dispatch_policy
          tests.test_computer_runtime_integrity
          tests.test_computer_filesystem_actions
          tests.test_device_mcp_headless_files
          tests.test_studio_product_account
          tests.test_studio_electron_account_session
          tests.test_computer_process_actions
          tests.test_product_mcp_server
          tests.test_ordax_os_runtime_compatibility_contract
          tests.test_managed_runtime_legacy_migration_contract
          tests.test_managed_runtime_precompile_contract
          tests.test_device_setup_legacy_bridge_path
          tests.test_runtime_cross_product_ownership_contract
