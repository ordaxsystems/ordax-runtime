name: ORDAX Runtime Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-runtime-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the canonical Runtime
        run: python -m pip install --disable-pip-version-check .
      - name: Verify native composition and shared transport lifecycle on Linux
        run: >-
          python -m unittest
          tests.test_native_runtime_composition
          tests.test_product_device_control_plane
          tests.test_product_central_session
          tests.test_terminal_outbox
          tests.test_orchestrator_app_bridge
          tests.test_canonical_control_plane_defaults
          tests.test_ordax_device_agent_alias

  product-mcp-minimum-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Runtime with the supported MCP SDK floor
        run: python -m pip install --disable-pip-version-check . "mcp==1.30.0"
      - name: Verify registered tools and recovery on the minimum SDK
        run: python -m unittest tests.test_product_action_recovery tests.test_product_remote_client tests.test_product_mcp_server tests.test_device_mcp_headless_files

  runtime-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read canonical Platform public Product auth configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ordaxsystems/ordax-platform
          ref: main
          path: .ordax/platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Assert every repository workflow uses immutable remote actions
        run: python -m unittest tests.test_release_signing_contract.ReleaseSigningContractTests.test_repository_workflow_remote_actions_are_immutable -v
      - name: Install Runtime package and test dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Assert installed Runtime public auth metadata matches Platform owner SSOT
        run: python -m unittest tests.test_public_product_auth_owner_parity -v

      - name: Compile Runtime packages
        run: python -m compileall -q ordax_connector ordax_dev_agent ordax_device_agent ordax_studio mcp_blender_unity

      - name: Validate managed runtime, updater, and publication governance PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/windows/ordax-device-agent-setup.ps1',
            'scripts/windows/apply-ordax-production-update.ps1',
            'scripts/windows/assert-release-main-ancestry.ps1',
            'scripts/windows/assert-github-main-governance.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Run Runtime ownership, release governance, and Computer Control contracts
        run: >-
          python -m unittest
          tests.test_release_main_ancestry
          tests.test_agent_recovery_governance_contract
          tests.test_product_gateway
          tests.test_orchestrator_app_bridge
          tests.test_application_intelligence_actions
          tests.test_product_mcp
          tests.test_product_remote_client
          tests.test_connector_owner_grants
          tests.test_owner_grants_cli
          tests.test_product_action_recovery
          tests.test_product_central_session
          tests.test_product_device_control_plane
          tests.test_product_update
          tests.test_product_update_apply
          tests.test_owner_dev_update_preflight
          tests.test_versioning
          tests.test_studio_managed_browser_contract
          tests.test_product_action_scope_parity
          tests.test_computer_parity_contract
          tests.test_computer_focus_window
          tests.test_computer_access_management
          tests.test_computer_full_access
          tests.test_computer_dispatch_policy
          tests.test_computer_runtime_integrity
          tests.test_computer_filesystem_actions
          tests.test_device_mcp_headless_files
          tests.test_studio_product_account
          tests.test_studio_electron_account_session
          tests.test_computer_process_actions
          tests.test_product_mcp_server
          tests.test_ordax_os_runtime_compatibility_contract
          tests.test_managed_runtime_legacy_migration_contract
          tests.test_managed_runtime_precompile_contract
          tests.test_device_setup_legacy_bridge_path
