# Independent OrdaX MCP package proof. No Studio source, no publishing.
name: OrdaX MCP Windows Candidate
on:
  pull_request:
    paths: &mcp_candidate_paths
      - ".github/workflows/windows-mcp-candidate.yml"
      - "scripts/windows/build-ordax-mcp.ps1"
      - "scripts/windows/get-locked-embedded-python.ps1"
      - "packaging/windows/embedded-python.lock.json"
      - "tests/test_windows_embedded_python_source.py"
      - "packaging/windows/ordax-mcp.iss"
      - "packaging/windows/ordax_launcher.c"
      - "scripts/windows/assert-runtime-package-capabilities.ps1"
      - "scripts/windows/ordax-upgrade-quiesce.ps1"
      - "tests/test_windows_mcp_distribution.py"
      # This installer pip-installs the exact Runtime project source, not a
      # hand-picked set of entrypoints. Keep these package roots byte-for-byte
      # aligned with tool.setuptools.packages.find.include in pyproject.toml.
      - "mcp_blender_unity/**"
      - "ordax_core/**"
      - "ordax_studio/**"
      - "ordax_connector/**"
      - "ordax_dev_agent/**"
      - "ordax_device_agent/**"
      - "scripts/windows/resolve-control-plane-provenance.py"
      - "control-plane-source.lock.json"
      - "pyproject.toml"
  # Only package-relevant changes in the canonical main get a fresh
  # independently verified, short-retention MCP candidate. Same paths as PR.
  push:
    branches:
      - main
    paths: *mcp_candidate_paths
  workflow_dispatch:

# Do not cancel an already running builder or waste the verified Python cache.
# A manual main verification and a push to main remain serial.
concurrency:
  group: ordax-mcp-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mcp-windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check canonical independent installer ownership
        shell: pwsh
        run: |
          python -m unittest tests.test_windows_mcp_distribution tests.test_windows_embedded_python_source
          if ($LASTEXITCODE -ne 0) { throw 'MCP distribution source contract failed' }
          $tokens = $null
          $errors = $null
          foreach ($path in @(
            'scripts/windows/build-ordax-mcp.ps1',
            'scripts/windows/assert-runtime-package-capabilities.ps1',
            'scripts/windows/get-locked-embedded-python.ps1',
            'scripts/windows/ordax-upgrade-quiesce.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) { throw "MCP packaging PowerShell syntax invalid in $path : $errors" }
          }
          # A poisoned cached Python archive must fail before any extraction;
          # no network access and no public signing identity are involved.
          $lock = Get-Content .\packaging\windows\embedded-python.lock.json -Raw | ConvertFrom-Json
          $badCache = Join-Path $env:RUNNER_TEMP 'ordax-mcp-tampered-python'
          New-Item -ItemType Directory -Force -Path $badCache | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $badCache $lock.filename), [byte[]](1,2,3,4))
          $failedClosed = $false
          try {
            & .\scripts\windows\get-locked-embedded-python.ps1 -CacheRoot $badCache -PythonVersion $lock.version | Out-Null
          } catch {
            if ($_.Exception.Message -notmatch 'ORDAX_EMBEDDED_PYTHON_SHA256_MISMATCH') { throw }
            $failedClosed = $true
          }
          if (-not $failedClosed) { throw 'Tampered embedded Python cache was not rejected' }

  mcp-windows-installer:
    runs-on: windows-latest
    needs: mcp-windows-contract
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve existing canonical Platform source pin
        id: lock
        shell: pwsh
        run: |
          $lock = Get-Content .\control-plane-source.lock.json -Raw | ConvertFrom-Json
          if ($lock.schema -ne 'ordax.control-plane-source-lock/1' -or
              $lock.authority -ne 'none' -or
              $lock.source.repository -ne 'ordaxsystems/ordax-platform' -or
              [string]$lock.source.commit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Invalid existing Platform lock'
          }
          "commit=$($lock.source.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ordaxsystems/ordax-platform
          ref: ${{ steps.lock.outputs.commit }}
          path: .ordax/platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enable pinned native Runtime launcher compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build standalone Runtime candidate without Studio checkout
        shell: pwsh
        run: |
          .\scripts\windows\build-ordax-mcp.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\dist\mcp-windows" -PlatformSource "$env:GITHUB_WORKSPACE\.ordax\platform" -ControlPlaneEnvironment validation-candidate
          if ($LASTEXITCODE -ne 0) { throw 'Independent OrdaX MCP candidate build failed' }
      - name: Verify installation, private Runtime, lifecycle, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem .\dist\mcp-windows\OrdaX-MCP-Setup-*-x64.exe)
          if ($setups.Count -ne 1) { throw 'Expected one exact MCP installer' }
          $hash = (Get-FileHash $setups[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cnotmatch '^[0-9a-f]{64}$') { throw 'MCP installer digest missing' }
          function Invoke-Bounded([string]$binary, [string]$arguments) {
            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = [System.Diagnostics.ProcessStartInfo]::new($binary, $arguments)
            $proc.StartInfo.UseShellExecute = $false
            if (-not $proc.Start()) { throw "Unable to start $binary" }
            if (-not $proc.WaitForExit(120000)) {
              $proc.Kill()
              throw "Installer/uninstaller exceeded time bound"
            }
            if ($proc.ExitCode -ne 0) { throw "Installer/uninstaller failed code $($proc.ExitCode)" }
            $proc.Dispose()
          }
          Invoke-Bounded $setups[0].FullName '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          $root = Join-Path $env:LOCALAPPDATA 'Programs\OrdaX MCP'
          $privatePython = Join-Path $root 'runtime\python.exe'
          if (-not (Test-Path (Join-Path $root 'ORDAX Runtime.exe')) -or
              -not (Test-Path $privatePython) -or
              -not (Test-Path (Join-Path $root 'product-manifest.json')) -or
              (Test-Path (Join-Path $root 'ORDAX Studio.exe')) -or
              (Test-Path (Join-Path $root 'presentation'))) {
            throw 'MCP installed inventory contains missing Runtime or Studio duplication'
          }
          $manifest = Get-Content (Join-Path $root 'product-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'ordax.mcp-windows-candidate/1' -or
              $manifest.product -ne 'OrdaX MCP' -or
              $manifest.studio_required -ne $false -or
              $manifest.signed_public_release -ne $false -or
              $manifest.runtime_source_commit -cne $env:GITHUB_SHA) {
            throw 'Candidate provenance, ownership or release status invalid'
          }
          & .\scripts\windows\assert-runtime-package-capabilities.ps1 -PrivatePython $privatePython -RuntimeRoot (Join-Path $root 'runtime') -Phase installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed Runtime capability proof failed' }
          & $privatePython -m ordax_dev_agent.owner_grants_cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installed OAuth Owner CLI unavailable' }
          # The clickable shortcut must target only the private packaged
          # Python GUI that delegates to canonical Owner OAuth. Never run
          # interactive OAuth against external services from a CI fixture.
          $privatePythonw = Join-Path $root 'runtime\pythonw.exe'
          if (-not (Test-Path -LiteralPath $privatePythonw)) {
            throw 'Installed private GUI host missing'
          }
          # The end-user first-run choice must not launch during CI's
          # /VERYSILENT install: no unattended browser OAuth or grants.
          $unexpectedGui = @(Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" |
            Where-Object {
              $_.ExecutablePath -and
              ([IO.Path]::GetFullPath([string]$_.ExecutablePath) -ieq $privatePythonw)
            })
          if ($unexpectedGui.Count -ne 0) {
            throw 'Silent MCP install unexpectedly launched Owner onboarding'
          }
          # Embedded CPython uses an isolated _pth and cannot import the
          # checkout's tests package by module name. Execute the source test
          # file directly while importing runtime dependencies from the
          # installed, private site-packages.
          & $privatePython (Join-Path $env:GITHUB_WORKSPACE 'tests\test_owner_device_connect_gui.py')
          if ($LASTEXITCODE -ne 0) { throw 'GUI Owner onboarding unit tests failed' }
          & $privatePython (Join-Path $env:GITHUB_WORKSPACE 'tests\test_product_ingress_failover.py')
          if ($LASTEXITCODE -ne 0) { throw 'Owner HTTPS diagnostic ingress contracts failed' }
          $shortcutPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\OrdaX MCP\Conectar dispositivo.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath)) {
            throw 'One-click device enrollment shortcut missing'
          }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -ine $privatePythonw -or
              $shortcut.Arguments -cne '-m ordax_dev_agent.owner_device_connect_gui') {
            throw 'One-click shortcut does not use the canonical private Owner onboarding'
          }
          $diagnosticShortcutPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\OrdaX MCP\Verificar conexão.lnk'
          if (-not (Test-Path -LiteralPath $diagnosticShortcutPath)) {
            throw 'Private read-only MCP network diagnostic shortcut missing'
          }
          $diagnosticShortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($diagnosticShortcutPath)
          if ($diagnosticShortcut.TargetPath -ine $privatePythonw -or
              $diagnosticShortcut.Arguments -cne '-m ordax_dev_agent.owner_device_connect_gui --verificar-rede') {
            throw 'MCP network diagnostic is not routed through the single canonical private GUI'
          }
          $uninstaller = Join-Path $root 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Standalone MCP uninstaller missing' }
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'ordax-mcp-uninstall.log'
          try {
            Invoke-Bounded $uninstaller ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="' + $uninstallLog + '"')
          } catch {
            if (Test-Path -LiteralPath $uninstallLog) {
              Get-Content -LiteralPath $uninstallLog -Tail 50 | Write-Host
            }
            throw
          }
          if (Test-Path (Join-Path $root 'ORDAX Runtime.exe')) { throw 'Standalone MCP Runtime remained after uninstall' }
          if (Test-Path -LiteralPath $shortcutPath) { throw 'MCP connect shortcut remained after uninstall' }
          if (Test-Path -LiteralPath $diagnosticShortcutPath) { throw 'MCP network diagnostic shortcut remained after uninstall' }
          Write-Host "ORDAX_MCP_STANDALONE_INSTALL_SMOKE=PASS SHA256=$hash"
      - name: Retain unsigned validation candidate (never publish public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ordax-mcp-windows-candidate-${{ github.sha }}
          path: dist/mcp-windows/OrdaX-MCP-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 3
